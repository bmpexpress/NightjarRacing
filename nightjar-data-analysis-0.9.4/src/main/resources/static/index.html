<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nightjar Data Analysis</title><link rel="icon" href="/Logo.png"><link rel="stylesheet" href="/styles.css"><script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script></head><body>
<div id="login" class="card login-card hidden"><img class="login-logo" src="/Logo.png" alt="Nightjar Racing"><h1>Nightjar Data Analysis</h1><p class="version">Version 0.9.4</p><label>Password</label><input id="password" type="password"><button id="signIn">Sign in</button></div>
<div id="app" class="shell hidden"><aside id="sidebar" class="sidebar"><div class="brand"><img class="brand-logo" src="/Logo.png" alt="Nightjar Racing"><div><h1>Data Analysis</h1><span class="version">Version 0.9.4</span></div></div><h3>Events and filters</h3><label>Event area</label><select id="eventArea"><option value="All">All events</option><option>Inshore</option><option>Offshore</option></select><label>Events</label><select id="events" multiple size="6"></select><div class="grid"><div><label>From</label><input id="from" type="date"></div><div><label>To</label><input id="to" type="date"></div></div><label class="inline"><input id="trim" type="checkbox"> Trim by time</label><div class="grid"><input id="start" type="time" value="00:00:00" step="1"><input id="end" type="time" value="23:59:59" step="1"></div><button id="apply">Apply filters</button><p id="status" class="muted"></p><hr><h3>Input files</h3><form id="upload"><label>Expedition log</label><input name="log" type="file"><label>Target polar</label><input name="polar" type="file"><label>Expedition EventData</label><input name="events" type="file"><label>Expedition TestData</label><input name="testData" type="file"><label>Event list</label><input name="eventList" type="file"><label>Sail chart</label><input name="sailChart" type="file"><label>Debrief</label><input name="debrief" type="file"><button>Load selected files</button></form></aside>
<main class="content"><div class="tabbar"><nav id="tabs" class="tabs"><button class="tab active" data-page="overview">Overview</button><button class="tab" data-page="polar">Polar</button><button class="tab" data-page="sails">Sail selection</button><button class="tab" data-page="gps">Map View</button><button class="tab" data-page="variable">Variable plot</button><button class="tab" data-page="files">Files</button><button class="tab" data-page="settings">Settings</button></nav><button id="toggleSidebar" class="sidebar-toggle" aria-controls="sidebar" aria-expanded="true">☰ Hide panel</button></div><div id="messages"></div>
<section id="page-overview" class="page active"><div id="metrics" class="metrics"></div><div class="grid card"><div><label>Time average (seconds)</label><input id="overviewAvg" type="number" min="0" value="0"></div><div><label>Maximum variation</label><input id="overviewVar" type="number" min="0" step=".1" value="0"></div></div><div id="overviewPlot" class="plot small"></div><div class="card table"><table id="dataTable"></table></div></section>
<section id="page-polar" class="page"><div class="grid card"><div><label>Target TWS</label><select id="polarTws"></select></div><div><label>TWS tolerance ±</label><input id="polarTol" type="number" value="1" step=".1"></div><div><label>View</label><select id="polarView"><option value="half">Half polar (0–180°)</option><option value="full">Full polar</option><option value="cartesian">Cartesian</option></select></div><div class="switches"><label class="switch"><input id="polarTack" type="checkbox"> Colour by tack</label><label class="switch"><input id="polarEvent" type="checkbox"> Colour by event</label></div><div><label>Time average (seconds)</label><input id="polarAvg" type="number" min="0" value="0"></div><div><label>Maximum variation</label><input id="polarVar" type="number" min="0" step=".1" value="0"></div></div><div id="polarPlot" class="plot"></div></section>
<section id="page-sails" class="page"><div class="card"><label>Plot type</label><select id="sailView"><option value="polar">Polar (0–180°)</option><option value="cartesian">Cartesian</option></select></div><div id="sailsPlot" class="plot"></div></section>
<section id="page-gps" class="page"><div class="grid card"><div><label>Continuous colour variable</label><select id="gpsColour"></select></div><div class="switches"><label class="switch"><input id="gpsTack" type="checkbox"> Colour by tack</label><label class="switch"><input id="gpsEvent" type="checkbox"> Colour by event</label></div><div><label>Time average (seconds)</label><input id="gpsAvg" type="number" min="0" value="0"></div><div><label>Maximum variation</label><input id="gpsVar" type="number" min="0" step=".1" value="0"></div></div><div id="gpsPlot" class="plot"></div></section>
<section id="page-variable" class="page"><div class="grid card"><div><label>X variable</label><select id="varX"></select><input id="varXLabel" placeholder="X axis label"></div><div><label>Y variable</label><select id="varY"></select><input id="varYLabel" placeholder="Y axis label"></div><div><label>Continuous colour</label><select id="varColour"></select></div><div><label>Type</label><select id="varKind"><option>Cartesian</option><option>Polar</option></select></div><div class="switches"><label class="switch"><input id="varTack" type="checkbox"> Colour by tack</label><label class="switch"><input id="varEvent" type="checkbox"> Colour by event</label><label class="switch"><input id="varAbs" type="checkbox"> Plot absolute values</label></div><div><label>X limits (min,max)</label><input id="varXLimits" placeholder="e.g. 0,180"></div><div><label>Y limits (min,max)</label><input id="varYLimits" placeholder="e.g. 0,12"></div><div><label>Time average (seconds)</label><input id="variableAvg" type="number" min="0" value="0"></div><div><label>Maximum variation</label><input id="variableVar" type="number" min="0" step=".1" value="0"></div></div><div id="variablePlot" class="plot"></div></section>
<section id="page-files" class="page"><div class="card"><div class="file-controls"><div><label>Expedition file view</label><select id="fileSource"><option value="event">EventData</option><option value="test">TestData</option></select></div><button id="refreshFileData">Refresh filtered view</button></div><p id="fileCounts" class="muted"></p><p id="fileStatus" class="muted"></p><div class="table file-window"><table id="fileTable"></table></div></div><div class="card"><button id="csv">Download full filtered CSV</button> <button id="session" class="secondary">Download session</button></div></section>
<section id="page-settings" class="page"><h2>Settings</h2><button id="save">Save settings</button><div class="card"><h3>Figure performance</h3><label class="inline"><input id="downsample" type="checkbox"> Enable deterministic downsampling</label><p class="muted">Turn this off here in Settings to send every matched point to figures.</p><label>Maximum points per figure</label><input id="maxPoints" type="number" min="100" max="2000000" step="1000" value="10000"></div><div class="card"><h3>Variables</h3><button id="used" class="selected-action">Select only used</button> <button id="all" class="secondary">Select all</button> <button id="none" class="secondary">Select none</button><div id="variables" class="checks"></div></div><h3>Column mapping</h3><div id="mapping" class="grid card"></div></section>
</main></div><script src="/app.js"></script><script src="/v094-enhancements.js"></script></body></html>
