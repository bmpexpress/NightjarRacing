<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nightjar Data Analysis</title><link rel="stylesheet" href="/styles.css">
<script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script></head>
<body>
<section id="login" class="login hidden"><div class="brand" style="justify-content:center"><span class="brand-mark"></span><h1>Nightjar Data Analysis</h1></div><p class="version">Version 0.9.0</p><div class="card"><label>Password</label><input id="password" type="password"><button id="loginButton" style="margin-top:.8rem">Sign in</button><p id="loginError" class="notice hidden"></p></div></section>
<div id="app" class="shell hidden">
<aside class="sidebar"><div class="brand"><span class="brand-mark"></span><div><h1>Nightjar Data Analysis</h1><div class="version">Version 0.9.0</div></div></div><hr>
<button id="logout" class="secondary hidden">Sign out</button>
<h3>Input files</h3><form id="uploadForm">
<div class="file-row"><label>Expedition log</label><input name="log" type="file" accept=".csv,.txt"></div>
<div class="file-row"><label>Target polar</label><input name="polar" type="file" accept=".txt,.csv,.pol"></div>
<div class="file-row"><label>Expedition events (GUN times in UTC)</label><input name="events" type="file" accept=".csv,.txt"></div>
<div class="file-row"><label>Event list</label><input name="eventList" type="file" accept=".txt,.csv"></div>
<div class="file-row"><label>Sail selection chart</label><input name="sailChart" type="file" accept=".xml"></div>
<div class="file-row"><label>Debrief notes</label><input name="debrief" type="file" accept=".txt,.md,.docx"></div>
<button type="submit">Load selected files</button></form><hr>
<h3>Event filters</h3><label>Events</label><select id="eventFilter" multiple size="6"></select>
<div class="grid"><div><label>From</label><input id="fromDate" type="date"></div><div><label>To</label><input id="toDate" type="date"></div></div>
<label class="inline-check"><input id="trimTime" type="checkbox"> Trim data by time</label>
<div class="grid"><div><label>Start</label><input id="startTime" type="time" value="00:00:00" step="1"></div><div><label>End</label><input id="endTime" type="time" value="23:59:59" step="1"></div></div>
<button id="applyFilters" style="margin-top:.75rem">Apply filters</button><div id="status" class="muted" style="margin-top:.7rem">No log loaded.</div></aside>
<main class="content"><nav class="tabs" id="tabs">
<button class="tab active" data-page="overview">Overview</button><button class="tab" data-page="summary">Event summary</button><button class="tab" data-page="polar">Polar analysis</button><button class="tab" data-page="gps">GPS track</button><button class="tab" data-page="variable">Variable plot</button><button class="tab" data-page="files">Files &amp; sail chart</button><button class="tab" data-page="settings">Settings</button></nav>
<div id="messages"></div>
<section class="page active" id="page-overview"><div id="metrics" class="metrics"></div><div class="card"><div id="overviewPlot" class="plot small"></div></div><div class="card table-wrap"><table id="dataTable"></table></div></section>
<section class="page" id="page-summary"><h2>Event summary</h2><div id="summaryTable" class="card table-wrap"></div><h3>Start / GUN information</h3><div id="gunTable" class="card table-wrap"></div><h3>Debrief notes</h3><textarea id="debriefText" rows="12" readonly></textarea></section>
<section class="page" id="page-polar"><div class="grid card"><div><label>Target polar TWS</label><select id="polarTws"></select></div><div><label>Time averaging window (s)</label><input id="polarAverage" type="number" value="1" min="1" step="1"></div><div><label>TWS tolerance ± kt</label><input id="polarTolerance" type="number" value="1" min="0.1" step="0.1"></div><div><label>Max TWS variation</label><input id="polarTwsVariation" type="number" value="1" min="0" step="0.5"></div><div><label>Max BSP variation</label><input id="polarBspVariation" type="number" value="1" min="0" step="0.5"></div><div><label>Layout</label><select id="polarLayout"><option value="half">Half polar</option><option value="full">Full polar</option><option value="cartesian">Cartesian</option></select></div><div><label class="inline-check"><input id="polarAllWinds" type="checkbox"> Show all wind speeds</label></div></div><div id="polarPlot" class="plot"></div></section>
<section class="page" id="page-gps"><div class="grid card"><div><label>Colour track by</label><select id="gpsColour"></select></div><div><label>Colour min</label><input id="gpsMin" type="number" step="any"></div><div><label>Colour max</label><input id="gpsMax" type="number" step="any"></div><div><button id="gpsAuto">Auto scale</button></div></div><div id="gpsPlot" class="plot"></div></section>
<section class="page" id="page-variable"><div class="grid card"><div><label>X variable</label><select id="varX"></select></div><div><label>Y variable</label><select id="varY"></select></div><div><label>Colour</label><select id="varColour"></select></div><div><label>Plot type</label><select id="varKind"><option>Cartesian</option><option>Polar</option></select></div><div><label>Time averaging window (s)</label><input id="varAverage" type="number" value="1" min="1" step="1"></div><div><label>Max X variation</label><input id="varXTol" type="number" value="1" min="0" step="0.5"></div><div><label>Max Y variation</label><input id="varYTol" type="number" value="1" min="0" step="0.5"></div><div><label>Max colour variation</label><input id="varCTol" type="number" value="1" min="0" step="0.5"></div><div><button id="drawVariable">Draw plot</button></div></div><div id="variablePlot" class="plot"></div></section>
<section class="page" id="page-files"><div class="card"><button id="exportCsv">Download filtered log CSV</button> <button id="exportSession" class="secondary">Download session settings</button></div><div id="sailPlot" class="plot"></div></section>
<section class="page" id="page-settings"><h2>Settings</h2><p class="muted">Untick any variable to remove it from calculations, tables, selectors and plots.</p><div class="card"><div><button id="selectAll" class="secondary">Select all</button> <button id="selectNone" class="secondary">Select none</button></div><div id="variableList" class="check-list"></div></div><h3>Column mapping</h3><div id="mappingList" class="grid card"></div><button id="saveSettings">Save settings</button></section>
</main></div><script src="/app.js"></script></body></html>
